[package]
name = "focus-zen"
version = "0.1.0"
description = "A quiet local follow-up list"
authors = ["Focus Zen"]
edition = "2021"

[lib]
name = "focus_zen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }

