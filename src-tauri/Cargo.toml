[package]
name = "focus-zen"
version = "0.1.0"
description = "A quiet local follow-up list"
authors = ["Aimable Dusingizimana"]
license = "MIT"
repository = "https://github.com/adusingi/focus-zen"
edition = "2021"

[lib]
name = "focus_zen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }

